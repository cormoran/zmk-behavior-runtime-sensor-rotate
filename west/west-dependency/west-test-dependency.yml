# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      # Bumped from v0.3-branch+custom-studio-protocol (Zephyr 3.5) to align with
      # every other custom-settings consumer (runtime-macro/combo, template). The
      # older base predates `configdefault` (Kconfig) and
      # zephyr_linker_sources(ROM_SECTIONS ...) which zmk-feature-custom-settings
      # requires unconditionally, so custom-settings cannot configure on 3.5.
      revision: main+custom-studio-protocol
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
    - name: zmk-feature-custom-settings
      remote: cormoran
      revision: main

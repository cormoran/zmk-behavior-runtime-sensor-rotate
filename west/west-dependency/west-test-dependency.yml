# List of this module's dependencies for testing
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+custom-studio-protocol
      import:
        file: app/west.yml
      clone-depth: 1
    - name: zmk-west-commands
      remote: cormoran
      revision: main
      import: true
    - name: zmk-feature-custom-settings
      remote: cormoran
      # TODO: revert to `main` once cormoran/zmk-feature-custom-settings#41
      # (public zmk_custom_settings_notify_suppress_begin/end) merges.
      revision: feat/public-notify-suppress
